services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set a unique strong MSSQL_SA_PASSWORD in the deployment environment}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - om-stationary-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-publish
    container_name: om-stationary-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OMStationaryDb;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: "${OM_JWT_SIGNING_KEY:?Set a random OM_JWT_SIGNING_KEY of at least 32 UTF-8 bytes}"
      Jwt__Issuer: OMStationary.Api
      Jwt__Audience: OMStationary.Web
      Cors__AllowedOrigins__0: "${OM_STORE_ORIGIN:?Set OM_STORE_ORIGIN to the exact HTTPS storefront origin}"
      Admin__BootstrapEmail: "${OM_ADMIN_EMAIL:-}"
      Admin__BootstrapPassword: "${OM_ADMIN_PASSWORD:-}"
      Admin__BootstrapPhone: "${OM_ADMIN_PHONE:-}"
      Admin__NotificationEmail: "${OM_ADMIN_NOTIFICATION_EMAIL:-}"
      Admin__NotificationPhone: "${OM_ADMIN_NOTIFICATION_PHONE:-}"
      Admin__BootstrapOverwritePassword: "false"
      Payments__Enabled: "${PAYMENTS_ENABLED:-false}"
      Payments__Provider: "${PAYMENTS_PROVIDER:-UPI}"
      Payments__Upi__Vpa: "${PAYMENTS_UPI_VPA:-}"
      Payments__Upi__PayeeName: "${PAYMENTS_UPI_PAYEE_NAME:-OM Stationary}"
      Delivery__Enabled: "${DELIVERY_ENABLED:-false}"
      OmStationary__Address: "${OM_PICKUP_ADDRESS:-}"
      WhatsApp__Enabled: "${WHATSAPP_ENABLED:-false}"
      WhatsApp__Provider: "${WHATSAPP_PROVIDER:-Your API}"
      WhatsApp__AccessToken: "${WHATSAPP_ACCESS_TOKEN:-}"
      Email__Enabled: "${EMAIL_ENABLED:-false}"
      Email__SmtpHost: "${EMAIL_SMTP_HOST:-}"
      Email__SmtpPort: "${EMAIL_SMTP_PORT:-587}"
      Email__SmtpUser: "${EMAIL_SMTP_USER:-}"
      Email__SmtpPassword: "${EMAIL_SMTP_PASSWORD:-}"
      Email__FromAddress: "${EMAIL_FROM_ADDRESS:-}"
      Sms__Enabled: "${SMS_ENABLED:-false}"
      Sms__Provider: "${SMS_PROVIDER:-Twilio}"
      Sms__AccountSid: "${SMS_ACCOUNT_SID:-}"
      Sms__ApiKey: "${SMS_AUTH_TOKEN:-}"
      Sms__SenderId: "${SMS_SENDER_ID:-}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - om-stationary-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-publish
      args:
        VITE_API_URL: ""
    container_name: om-stationary-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "${TLS_CERT_DIR:?Set TLS_CERT_DIR to a directory containing fullchain.pem and privkey.pem}:/etc/nginx/certs:ro"
    depends_on:
      - api
    networks:
      - om-stationary-network
    restart: unless-stopped

volumes:
  sqlserver_data:
    name: om-stationary-sqlserver-data

networks:
  om-stationary-network:
    driver: bridge
