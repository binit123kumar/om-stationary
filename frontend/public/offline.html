<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#103f76" />
    <title>Offline | OM Stationary</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f9fc; color: #172033; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 460px); padding: 32px; border: 1px solid #e8edf4; border-radius: 20px; background: #fff; text-align: center; }
      .brand { color: #103f76; font-size: 24px; font-weight: 900; }
      p { color: #59677b; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; margin-top: 12px; padding: 0 18px; border-radius: 10px; background: #ff6b0a; color: #fff; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #0b67cf; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">OM STATIONARY</div>
      <h1>You’re offline</h1>
      <p>The store could not be reached. Reconnect to browse current products and account information. Orders, payments and other server actions are unavailable offline.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
